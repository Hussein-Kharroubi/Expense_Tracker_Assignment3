<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            color: #222;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        h1 { color: #222; margin-bottom: 0.25rem; }
        h2 { color: #222; margin-top: 0; }
        .subtitle { margin-top: 0; color: #5a5a5a; }

        .forms { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-top: 2rem; }

        form p { margin: 0 0 0.9rem; }
        form label { display: block; margin-bottom: 0.2rem; }
        form input { width: 100%; box-sizing: border-box; padding: 0.45rem; font: inherit; border: 1px solid #ccc; }
        form .helptext, form ul { font-size: 0.8rem; color: #5a5a5a; }
        form ul.errorlist { color: #b3261e; padding-left: 1rem; margin: 0 0 0.3rem; }

        button {
            width: 100%;
            height: 44px;
            font: inherit;
            background: #f4f4f4;
            border: 1px solid #222;
            color: #222;
            cursor: pointer;
        }
        button:hover { background: #222; color: #fff; }

        .messages { list-style: none; padding: 0; color: #b3261e; }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>
    <p class="subtitle">Log in or create an account to track your spending.</p>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}

    <div class="forms">
        <div>
            <h2>Login</h2>
            <form method="post">
                {% csrf_token %}
                {{ LoginForm.as_p }}
                <button type="submit" name="login">Login</button>
            </form>
        </div>

        <div>
            <h2>Register</h2>
            <form method="post">
                {% csrf_token %}
                {{ RegisterForm.as_p }}
                <button type="submit" name="register">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
